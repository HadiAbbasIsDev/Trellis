name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: node scripts/build.mjs
      - run: node packages/vscode-ext/build.mjs
      - run: node scripts/smoke.mjs
      # selftest drives commands through sh; wiring behavior itself is covered
      # cross-platform by packages/wiring/test
      - if: runner.os != 'Windows'
        run: node scripts/hooks/selftest.mjs
      - if: runner.os == 'Linux' && matrix.node == 22
        run: npx tsx packages/eval/src/run.ts
